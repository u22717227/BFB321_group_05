{% extends "base.html" %}
{% block title %}Report a stop or pickup | Eyabantu{% endblock %}
{% block content %}
  <section class="page-banner">
    <div class="wrap">
      <h1>Report a stop or pickup</h1>
      <p>3 or more reports will verify the stop or pickup</p>
    </div>
  </section>
  <main class="wrap">
    <section class="card">
      <form method="POST">
        <label for="stop">Stop name</label>
        <select id="stop" name="stop" required>
          <option value="">Choose a stop...</option>
          {% for s in stops %}
          <option>{{ s.name }}</option>
          {% endfor %}
        </select>

        <label for="type">Report type</label>
        <select id="type" name="type" required>
          <option value="">Choose...</option>
          <option>Taxi stops here</option>
          <option>I was picked up safely</option>
          <option>I felt safe while waiting at this stop</option>
        </select>

        <label for="safety">Safety rating (1-5)</label>
        <input id="safety" name="safety" type="number" min="1" max="5" required>

        <button type="submit">Submit report</button>
      </form>
    </section>
  </main>
{% endblock %}
